name: Demo retained-copy discard

on:
  workflow_dispatch:
    inputs:
      action:
        description: Preflight first; discard runs one bounded batch only
        required: true
        type: choice
        options: [preflight, discard]
      kind:
        description: none for preflight; room or catalogue for one discard batch
        required: true
        type: choice
        options: [none, room, catalogue]
      source_sha:
        description: Exact accepted current Main commit
        required: true
        type: string
      expires_at:
        description: Fixed UTC deadline YYYY-MM-DDTHH:mm:ss.sssZ within thirty minutes
        required: true
        type: string
      manifest_sha256:
        description: Actual verified preflight manifest digest; empty for preflight
        required: false
        type: string
      decision:
        description: saas38-pre-pilot-demo-only for discard; empty for preflight
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: live-media-operator
  cancel-in-progress: false

jobs:
  operator:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.actor == 'floriankreutzer' && github.triggering_actor == 'floriankreutzer' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEMO_COPY_ACTION: ${{ inputs.action }}
      DEMO_COPY_KIND: ${{ inputs.kind }}
      DEMO_COPY_SOURCE_SHA: ${{ inputs.source_sha }}
      DEMO_COPY_EXPIRES_AT: ${{ inputs.expires_at }}
      DEMO_COPY_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      DEMO_COPY_DECISION: ${{ inputs.decision }}
    steps:
      - name: Checkout exact Main controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Validate exact source, actor, decision and deadline before secret allocation
        run: node --input-type=module -e "import { loadDemoCopyDiscardContext } from './scripts/support/demo-copy-discard-context.mjs'; loadDemoCopyDiscardContext(process.env);"
      - name: Install locked dependencies without operator secrets
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify all objects and perform at most one acknowledged Demo batch
        env:
          CM_NEON_LIVE_OPERATOR_DATABASE_URL: ${{ secrets.CM_NEON_LIVE_OPERATOR_DATABASE_URL }}
          CM_NEON_LIVE_OPERATOR_ACCESS_KEY_ID: ${{ secrets.CM_NEON_LIVE_OPERATOR_ACCESS_KEY_ID }}
          CM_NEON_LIVE_OPERATOR_SECRET_ACCESS_KEY: ${{ secrets.CM_NEON_LIVE_OPERATOR_SECRET_ACCESS_KEY }}
        run: node scripts/demo-copy-discard-workflow.mjs
      - name: Retain bounded non-secret preflight and batch reconciliation receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-copy-discard-${{ github.run_id }}
          path: /tmp/demo-copy-discard-result.json
          if-no-files-found: warn
          retention-days: 7
