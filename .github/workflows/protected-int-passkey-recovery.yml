name: Protected INT encrypted passkey recovery

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact accepted Main commit; private request and recipient belong in the protected environment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-shared-demo-database-initialize
  cancel-in-progress: false

jobs:
  deliver:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.expected_main_sha == github.sha && github.actor == 'floriankreutzer' &&
      github.triggering_actor == 'floriankreutzer' && github.run_attempt == 1
    environment:
      name: hosted-demo-initialize
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require ordinary logging before secret allocation
        env:
          ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG }}
          ACTIONS_RUNNER_DEBUG: ${{ secrets.ACTIONS_RUNNER_DEBUG }}
        run: test -z "${RUNNER_DEBUG:-}${ACTIONS_STEP_DEBUG:-}${ACTIONS_RUNNER_DEBUG:-}"
      - name: Checkout exact accepted Main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout before dependency installation
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked dependencies without operator secrets
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Issue canonical recovery into private pipe and encrypt for the verified recipient
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          NODE_ENV: pilot
          DEPLOYMENT_ENVIRONMENT: int
          PLATFORM_SECURITY_EPOCH: ${{ secrets.CM_INT_AUDIT_SECURITY_REVISION }}
          PLATFORM_PASSKEY_OFFLINE_ROLE: ${{ secrets.CM_INT_AUDIT_OFFLINE_ROLE }}
          PLATFORM_PASSKEY_OFFLINE_DATABASE_URL: ${{ secrets.CM_INT_AUDIT_OFFLINE_DATABASE_URL }}
          PLATFORM_DATABASE_URL: ${{ secrets.CM_INT_AUDIT_PLATFORM_DATABASE_URL }}
          PLATFORM_AUDIT_HMAC_SECRET: ${{ secrets.CM_INT_AUDIT_HMAC_SECRET }}
          PLATFORM_AUDIT_SEGMENT_ID: ${{ secrets.CM_INT_AUDIT_SEGMENT_ID }}
          PLATFORM_AUDIT_SEGMENT_DEPLOYMENT_EPOCH: ${{ secrets.CM_INT_AUDIT_DEPLOYMENT_EPOCH }}
          PLATFORM_OWNER_BOOTSTRAP_DIRECTORY_ID: ${{ secrets.CM_INT_OWNER_DIRECTORY_ID }}
          PLATFORM_OWNER_BOOTSTRAP_SUBJECT_ID: ${{ secrets.CM_INT_OWNER_SUBJECT_ID }}
          CM_INT_PASSKEY_OPERATOR_ID: ${{ secrets.CM_INT_PASSKEY_OPERATOR_ID }}
          CM_INT_PASSKEY_OPERATOR_VERSION: ${{ secrets.CM_INT_PASSKEY_OPERATOR_VERSION }}
          CM_INT_PASSKEY_REQUEST_JSON: ${{ secrets.CM_INT_PASSKEY_REQUEST_JSON }}
          CM_INT_PASSKEY_EVIDENCE: ${{ secrets.CM_INT_PASSKEY_EVIDENCE }}
          CM_INT_PASSKEY_RECIPIENT_PUBLIC_KEY: ${{ secrets.CM_INT_PASSKEY_RECIPIENT_PUBLIC_KEY }}
          CM_INT_PASSKEY_RECIPIENT_SHA256: ${{ secrets.CM_INT_PASSKEY_RECIPIENT_SHA256 }}
        run: node scripts/platform-passkey-bootstrap-deliver.mjs
      - name: Retain only encrypted capability for one day
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protected-int-passkey-recovery
          path: ${{ runner.temp }}/protected-int-passkey-grant/grant.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove encrypted runner copy
        if: always()
        run: rm -f "$RUNNER_TEMP/protected-int-passkey-grant/grant.json"
