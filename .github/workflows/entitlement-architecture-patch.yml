name: Entitlement Architecture Patch

on:
  push:
    branches:
      - feature/tenant-entitlements
    paths:
      - .github/workflows/entitlement-architecture-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/tenant-entitlements
      - name: Patch architecture gate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/check-architecture.mjs')
          text = path.read_text()
          replacements = [
              (
                  "  'createPostgresAuditRepository',\n  'auditRepository',",
                  "  'createPostgresAuditRepository',\n  'createPostgresEntitlementRepository',\n  'auditRepository',\n  'entitlementRepository',",
              ),
              (
                  "if (!pool.includes('CURRENT_SCHEMA_VERSION = 4')) {\n  throw new Error('Runtime schema readiness must require audit migration version 4.');\n}",
                  "if (!pool.includes('CURRENT_SCHEMA_VERSION = 5')) {\n  throw new Error('Runtime schema readiness must require entitlement migration version 5.');\n}",
              ),
              (
                  "  'migrations/004_tamper_evident_audit.up.sql',\n  'migrations/004_tamper_evident_audit.down.sql',",
                  "  'migrations/004_tamper_evident_audit.up.sql',\n  'migrations/004_tamper_evident_audit.down.sql',\n  'migrations/005_tenant_entitlements.up.sql',\n  'migrations/005_tenant_entitlements.down.sql',",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'architecture pattern mismatch: {old!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/check-architecture.mjs
          git commit -m "Extend architecture gate for entitlements"
          git push origin HEAD:feature/tenant-entitlements
