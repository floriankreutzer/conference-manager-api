name: Fix request fixture time

on:
  push:
    branches:
      - feature/provider-neutral-booking-contracts
    paths:
      - .github/workflows/fix-request-fixture-time.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/provider-neutral-booking-contracts
      - name: Make request fixtures deterministic
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests-db/postgres-persistence.test.js')
          text = path.read_text()
          old = """    `INSERT INTO requests
      (tenant_id, id, requester_user_id, status, starts_at, ends_at, internal_participants, external_participants)
     VALUES ($1, $2, $3, $4, $5, $6, $7, $8)`,
    [
      tenantId,
      requestId,
      requesterUserId,
      status,
      '2026-09-01T10:00:00.000Z',
      '2026-09-01T11:00:00.000Z',
      4,
      1,
    ],"""
          new = """    `INSERT INTO requests
      (tenant_id, id, requester_user_id, status, starts_at, ends_at,
       internal_participants, external_participants, status_changed_at, created_at, updated_at)
     VALUES ($1, $2, $3, $4, $5, $6, $7, $8, $9, $9, $9)`,
    [
      tenantId,
      requestId,
      requesterUserId,
      status,
      '2026-09-01T10:00:00.000Z',
      '2026-09-01T11:00:00.000Z',
      4,
      1,
      '2026-08-24T09:00:00.000Z',
    ],"""
          if text.count(old) != 1:
              raise SystemExit('seedRequest pattern mismatch')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit deterministic fixture
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests-db/postgres-persistence.test.js
          git commit -m "Make request persistence fixtures time-independent"
          git push origin HEAD:feature/provider-neutral-booking-contracts
