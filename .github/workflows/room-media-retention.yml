name: Room media retention

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: room-media-retention
  cancel-in-progress: false

jobs:
  retention:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: production
      DATABASE_SSL: verify-full
      ROOM_MEDIA_RETENTION_DATABASE_URL: ${{ secrets.ROOM_MEDIA_RETENTION_DATABASE_URL }}
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Require dedicated database credential
        run: test -n "$ROOM_MEDIA_RETENTION_DATABASE_URL"
      - name: Prune only expired unreferenced Room media
        run: node scripts/room-media-retention.mjs --execute
