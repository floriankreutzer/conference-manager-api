name: Prepare reviewed MSAL 7 upgrade

on:
  push:
    branches: [fix/reviewed-msal7-upgrade]
    paths: [.github/workflows/prepare-reviewed-msal7.yml, tests/msal-package-contract.test.js]

permissions:
  contents: read

jobs:
  prepare-upgrade:
    if: github.repository == 'floriankreutzer/conference-manager-api'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the scoped upgrade branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install the approved baseline without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund
      - name: Characterize the installed baseline SDK
        run: node --test tests/msal-package-contract.test.js
      - name: Install the specifically reviewed target version
        run: npm install @azure/msal-node@7.0.0 --save-exact --ignore-scripts --no-fund
      - name: Update only the exact reviewed identity version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-architecture.mjs')
          source = p.read_text()
          old = "'@azure/msal-node': '6.0.1'"
          new = "'@azure/msal-node': '7.0.0'"
          if source.count(old) != 1:
              raise SystemExit('Reviewed architecture baseline changed; manual reconciliation required')
          p.write_text(source.replace(old, new, 1))
          PY
      - name: Verify real target SDK, dependency policy and audit
        run: |
          node --test tests/msal-package-contract.test.js
          npm run check:dependencies
          npm run audit
      - name: Commit scoped upgrade for normal PR validation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/reviewed-msal7-upgrade'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json scripts/check-architecture.mjs
          git commit -m 'chore(identity): pin reviewed MSAL 7 without relaxing dependency policy'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
