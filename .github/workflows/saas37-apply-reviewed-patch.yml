name: Prepare reviewed SaaS 3.7 correction commit

on:
  pull_request:
    paths:
      - .github/workflows/saas37-apply-reviewed-patch.yml
      - .github/saas37-correction.patch

permissions:
  contents: read

jobs:
  prepare-commit:
    if: github.head_ref == 'fix/saas37-onboarding-progression' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout exact correction branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify exact reviewed patch and create unreferenced commit only
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const repository = 'floriankreutzer/conference-manager-api';
          const patchPath = '.github/saas37-correction.patch';
          const patchSha256 = '96e0bf3612ae9dc66f4b2624c2802597ba663c0b9afd8f52a241958b8a7c346a';
          const expectedFiles = [
            'docs/SAAS-3.7-ACCEPTANCE-CORRECTIONS.md',
            'src/demo/customer-composition.js',
            'src/demo/fixture.js',
            'src/demo/provider/onboarding-room-inventory.js',
            'tests/demo-fixture.test.js',
            'tests/demo-provider.test.js',
            'tests/saas37-onboarding-provider-inventory.test.js',
          ].sort();
          assert.match(process.env.PR_HEAD, /^[0-9a-f]{40}$/);
          assert.equal(createHash('sha256').update(readFileSync(patchPath)).digest('hex'), patchSha256);
          assert.equal(execFileSync('git', ['hash-object', 'src/demo/fixture.js'], { encoding: 'utf8' }).trim(), '809fb9c557880c008d04fe2a226eaea7d0dec032');
          execFileSync('git', ['apply', '--index', '--whitespace=error-all', patchPath]);
          const changed = execFileSync('git', ['diff', '--cached', '--name-only', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean).sort();
          assert.deepEqual(changed, expectedFiles);
          async function api(path, body) {
            const response = await fetch(`https://api.github.com/repos/${repository}/${path}`, {
              method: body ? 'POST' : 'GET', redirect: 'error', signal: AbortSignal.timeout(20_000),
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            assert.ok(response.ok, `Git object operation failed: ${response.status}`);
            return response.json();
          }
          const parent = await api(`git/commits/${process.env.PR_HEAD}`);
          const entries = expectedFiles.map((path) => ({ path, mode: '100644', type: 'blob', content: readFileSync(path, 'utf8') }));
          const temporaryPaths = ['.github/saas37-correction.patch', '.github/workflows/saas37-apply-reviewed-patch.yml', '.github/workflows/saas37-offline-qa.yml'];
          const tree = await api('git/trees', {
            base_tree: parent.tree.sha,
            tree: [...entries, ...temporaryPaths.map((path) => ({ path, mode: '100644', type: 'blob', sha: null }))],
          });
          const commit = await api('git/commits', {
            message: 'fix: restore Northwind booking and real Fabrikam onboarding discovery\n\nApply reviewed, SHA-256-verified correction with regression tests and explicit baseline checksum documentation. Remove all temporary QA transfer machinery. No branch ref is moved by this workflow.',
            tree: tree.sha, parents: [process.env.PR_HEAD],
          });
          assert.match(commit.sha, /^[0-9a-f]{40}$/);
          const files = entries.map(({ path, content }) => ({ path, blobSha: createHash('sha1').update(`blob ${Buffer.byteLength(content)}\0`).update(content).digest('hex') }));
          writeFileSync('reviewed-correction-commit.json', JSON.stringify({ repository, parent: process.env.PR_HEAD, commit: commit.sha, patchSha256, files, removed: temporaryPaths }, null, 2));
          JS
      - name: Retain commit metadata for external verification and normal PR branch update
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-correction-commit
          path: reviewed-correction-commit.json
          if-no-files-found: error
          retention-days: 1
