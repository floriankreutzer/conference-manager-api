name: Neon Object Adapter Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-object-adapter-acceptance
  cancel-in-progress: false

jobs:
  isolated-provider-probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout accepted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run unchanged SDK against isolated private Neon branch
        env:
          NODE_ENV: test
          NEON_ACCEPTANCE_CONFIRM_BRANCH: br-falling-glade-b17oqqiv
          NEON_ACCEPTANCE_ACCESS_KEY_ID: ${{ secrets.CM_NEON_ACCEPTANCE_ACCESS_KEY_ID }}
          NEON_ACCEPTANCE_SECRET_ACCESS_KEY: ${{ secrets.CM_NEON_ACCEPTANCE_SECRET_ACCESS_KEY }}
        run: node scripts/neon-object-acceptance.mjs >neon-object-acceptance.json
      - name: Retain bounded credential-free provider evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neon-object-adapter-acceptance-${{ github.run_id }}
          path: |
            neon-object-acceptance.json
            neon-object-acceptance-intent.json
          if-no-files-found: error
          retention-days: 30
