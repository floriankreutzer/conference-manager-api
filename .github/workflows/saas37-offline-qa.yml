name: Temporary private SaaS 3.7 QA inputs

on:
  pull_request:
    paths:
      - .github/workflows/saas37-offline-qa.yml
      - tests/saas37-onboarding-provider-inventory.test.js

permissions:
  contents: read

jobs:
  private-inputs:
    if: github.head_ref == 'fix/saas37-onboarding-progression' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tracked private source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package tracked source and public dependencies only
        run: |
          git archive --format=tar HEAD | gzip > private-api-source.tar.gz
          tar -czf api-locked-dependencies.tar.gz node_modules
      - name: Retain QA inputs only within this private repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-api-qa-inputs
          path: |
            private-api-source.tar.gz
            api-locked-dependencies.tar.gz
          if-no-files-found: error
          retention-days: 1
