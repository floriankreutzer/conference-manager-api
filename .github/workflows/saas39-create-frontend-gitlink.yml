name: SaaS 3.9 create immutable frontend gitlink

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pin:
    if: github.ref == 'refs/heads/feat/saas39-private-frontend-submodule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prepared API branch
        uses: actions/checkout@v4
        with:
          ref: feat/saas39-private-frontend-submodule
          persist-credentials: true
          fetch-depth: 1
      - name: Create exact frontend gitlink without cloning frontend content
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/saas39-private-frontend-submodule"
          test -f .gitmodules
          git update-index --add --cacheinfo 160000,c1fee5e2c4f1d472174d194697dd635a5a9b0aef,vendor/demo-frontend
          test "$(git ls-files --stage vendor/demo-frontend | awk '{print $1" "$2}')" = "160000 c1fee5e2c4f1d472174d194697dd635a5a9b0aef"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "build(demo): pin immutable frontend submodule"
          git push origin HEAD:feat/saas39-private-frontend-submodule
