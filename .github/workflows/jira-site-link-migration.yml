name: Jira Site Link Migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview first; apply requires the exact fresh preview digest
        type: choice
        options: [preview, apply]
        default: preview
        required: true
      link_ids:
        description: Approved comma-separated CO or KNMCP issue-key:remote-link-id pairs (maximum 100)
        type: string
        required: true
      source_host_hash:
        description: SHA-256 of the exact approved old hostname (no URL)
        type: string
        required: true
      target_host_hash:
        description: SHA-256 of the approved new hostname; must match this cloud's serverInfo
        type: string
        required: true
      plan_digest:
        description: Required for apply; copy from the completed preview
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: jira-readiness-writer
  cancel-in-progress: false

jobs:
  migrate-links:
    if: github.repository == 'floriankreutzer/conference-manager-api' && github.ref == 'refs/heads/main'
    environment: jira-readiness-writer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Preview or update existing links without replacing their identities
        env:
          CM_JIRA_CLOUD_ID: ${{ vars.CM_JIRA_CLOUD_ID }}
          CM_JIRA_WRITER_ACCOUNT_ID: ${{ vars.CM_JIRA_WRITER_ACCOUNT_ID }}
          CM_JIRA_WRITER_EMAIL: ${{ secrets.CM_JIRA_WRITER_EMAIL }}
          CM_JIRA_WRITER_API_TOKEN: ${{ secrets.CM_JIRA_WRITER_API_TOKEN }}
          CM_SOURCE_HOST_HASH: ${{ inputs.source_host_hash }}
          CM_TARGET_HOST_HASH: ${{ inputs.target_host_hash }}
          CM_LINK_IDS: ${{ inputs.link_ids }}
          CM_MIGRATION_MODE: ${{ inputs.mode }}
          CM_PLAN_DIGEST: ${{ inputs.plan_digest }}
        run: node scripts/jira-site-link-migration.mjs
