name: Infrastructure environment branch-denial proof

on:
  workflow_dispatch:
    inputs:
      contract_version:
        description: Non-publishing administrative proof marker
        required: true
        type: string

permissions: {}

jobs:
  deny-non-main:
    if: >-
      github.repository == 'floriankreutzer/conference-manager-api' &&
      github.ref == 'refs/heads/audit/infra-environment-denial-20261030' &&
      github.actor == 'floriankreutzer' && github.triggering_actor == 'floriankreutzer' &&
      github.run_attempt == 1 && inputs.contract_version == 'environment-policy-proof'
    strategy:
      fail-fast: false
      matrix:
        environment: [public-api-publication, live-media-operator]
    environment:
      name: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Fail if the provider unexpectedly allocates a non-main job
        run: |
          echo 'ENVIRONMENT_BRANCH_POLICY_DID_NOT_BLOCK'
          exit 1
