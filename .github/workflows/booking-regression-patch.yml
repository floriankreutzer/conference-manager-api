name: Booking Regression Patch

on:
  push:
    branches:
      - feature/provider-neutral-booking-contracts
    paths:
      - .github/workflows/booking-regression-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/provider-neutral-booking-contracts
      - name: Patch schema-six migration regression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests-db/postgres-persistence.test.js')
          text = path.read_text()

          version_line = "      { version: 5, name: 'tenant_entitlements' },\n"
          version_six = "      { version: 6, name: 'booking_provider_references' },\n"
          if text.count(version_line) != 1 or version_six in text:
              raise SystemExit('migration version assertion precondition mismatch')
          text = text.replace(version_line, version_line + version_six, 1)

          marker = "  await t.test('audit migration refuses unreviewed legacy rows before reapplication', async () => {"
          start = text.find(marker)
          if start < 0:
              raise SystemExit('rollback test marker missing')
          end = text.find("\n  });", start)
          if end < 0:
              raise SystemExit('rollback test end missing')
          end += len("\n  });")

          replacement = """  await t.test('audit migration refuses unreviewed legacy rows before reapplication', async () => {
              assert.equal(await rollbackLatest(pool), true);
              assert.equal(await isPostgresSchemaReady(pool), false);
              let remaining = await pool.query('SELECT version FROM schema_migrations ORDER BY version');
              assert.deepEqual(remaining.rows, [
                { version: 1 },
                { version: 2 },
                { version: 3 },
                { version: 4 },
                { version: 5 },
              ]);

              assert.equal(await rollbackLatest(pool), true);
              remaining = await pool.query('SELECT version FROM schema_migrations ORDER BY version');
              assert.deepEqual(remaining.rows, [
                { version: 1 },
                { version: 2 },
                { version: 3 },
                { version: 4 },
              ]);

              assert.equal(await rollbackLatest(pool), true);
              remaining = await pool.query('SELECT version FROM schema_migrations ORDER BY version');
              assert.deepEqual(remaining.rows, [{ version: 1 }, { version: 2 }, { version: 3 }]);
              await assert.rejects(migrateUp(pool), (error) => error.code === '55000');
              await pool.query('DELETE FROM audit_events');
              await migrateUp(pool);
              assert.equal(await isPostgresSchemaReady(pool), true);

              assert.equal(await rollbackLatest(pool), true);
              assert.equal(await rollbackLatest(pool), true);
              assert.equal(await rollbackLatest(pool), true);
              assert.equal(await rollbackLatest(pool), true);
              assert.equal(await rollbackLatest(pool), true);
              remaining = await pool.query('SELECT version FROM schema_migrations ORDER BY version');
              assert.deepEqual(remaining.rows, [{ version: 1 }]);

              await migrateUp(pool);
              assert.equal(await isPostgresSchemaReady(pool), true);
            });"""

          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests-db/postgres-persistence.test.js
          git commit -m "Update migration regression for booking references"
          git push origin HEAD:feature/provider-neutral-booking-contracts
