    startCommand: npm run start:protected:customer
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_VERSION
        sync: false
      - key: NODE_ENV
        value: "production"
      - key: PROTECTED_ENVIRONMENT
        value: "int"
      - key: PROTECTED_API_COMMIT
        value: "ca1f06b5b5181965f7c3aeffdc235aa44c638771"
