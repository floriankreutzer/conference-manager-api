# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Existing protected INT resources; adopt only in the current paused Blueprint.
# Selected QA release pair; not a deployment receipt.
# See docs/QA-20261031-DAILY-RELEASE.md before any synchronization.
previews:
  generation: off
# Preserve ownership of the legacy group without injecting DEMO_* into INT.
# Existing values are retained when omitted; no key is generated or rotated.
envVarGroups:
  - name: conference-manager-demo-shared
    envVars: []
services:
  - type: web
    name: conference-manager-demo
    runtime: node
    plan: free
    region: frankfurt
    numInstances: 1
    repo: https://github.com/floriankreutzer/conference-manager-api
    branch: release/int-20261031-d65e5c7
    autoDeployTrigger: off
    previews:
      generation: off
    buildCommand: >-
      test "$(git rev-parse HEAD)" = "d65e5c797687c493bd3f860553e602171536f0d4" && npm ci --ignore-scripts --no-audit --no-fund && rm -rf .protected-ui-build && git clone --filter=blob:none --no-checkout https://github.com/floriankreutzer/conference-manager.git .protected-ui-build && git -C .protected-ui-build fetch --depth=1 origin a930bb1fbbda3f3d5037ec9c016c756363c60ae6 && git -C .protected-ui-build checkout --detach a930bb1fbbda3f3d5037ec9c016c756363c60ae6 && npm --prefix .protected-ui-build ci --include=dev --ignore-scripts --no-audit --no-fund && protected_api_root="$PWD" && cd .protected-ui-build && PROTECTED_API_COMMIT="$(git -C "$protected_api_root" rev-parse HEAD)" PROTECTED_FRONTEND_COMMIT=a930bb1fbbda3f3d5037ec9c016c756363c60ae6 PROTECTED_ENVIRONMENT=int PROTECTED_CUSTOMER_ORIGIN=https://conference-manager-demo.onrender.com PROTECTED_PLATFORM_ORIGIN=https://conference-manager-ops-demo.onrender.com PROTECTED_SYNTHETIC_ENABLED=true PROTECTED_PRESENTATION_MICROSOFT_ENABLED=true PROTECTED_PRESENTATION_INVITATIONS_ENABLED=true PROTECTED_OWNER_CUSTOMER_ACCESS_ENABLED=true node scripts/build-protected-frontend.mjs "$protected_api_root/.protected-frontend"
    startCommand: npm run start:protected:customer
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_VERSION
        sync: false
      - key: NODE_ENV
        value: "production"
      - key: PROTECTED_ENVIRONMENT
        value: "int"
      - key: PROTECTED_API_COMMIT
        value: "d65e5c797687c493bd3f860553e602171536f0d4"
      - key: PROTECTED_FRONTEND_COMMIT
        value: "a930bb1fbbda3f3d5037ec9c016c756363c60ae6"
      - key: PROTECTED_CUSTOMER_ORIGIN
        value: "https://conference-manager-demo.onrender.com"
      - key: PROTECTED_PLATFORM_ORIGIN
        value: "https://conference-manager-ops-demo.onrender.com"
      - key: PROTECTED_DATABASE_SSL
