# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Existing protected INT resources; adopt only in the current paused Blueprint.
# Selected QA release pair; not a deployment receipt.
# See docs/INFRASTRUCTURE-20261031-WRAPPER-RELEASE.md before any synchronization.
previews:
  generation: off
# Preserve ownership of the legacy group without injecting DEMO_* into INT.
# Existing values are retained when omitted; no key is generated or rotated.
envVarGroups:
  - name: conference-manager-demo-shared
    envVars: []
services:
  - type: web
    name: conference-manager-demo
    runtime: node
    plan: free
    region: frankfurt
    numInstances: 1
    repo: https://github.com/floriankreutzer/conference-manager-api
    branch: release/int-20261031-2c67a8f
    autoDeployTrigger: off
    previews:
      generation: off
    buildCommand: >-
      test "$(git rev-parse HEAD)" = "2c67a8f6b7495335357cf60a20f146bf4e10d669" && PROTECTED_PRESENTATION_MICROSOFT_ENABLED=true PROTECTED_PRESENTATION_INVITATIONS_ENABLED=true node scripts/render-build-protected.mjs
    startCommand: npm run start:protected:customer
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_VERSION
        sync: false
      - key: NODE_ENV
        value: "production"
      - key: PROTECTED_ENVIRONMENT
        value: "int"
      - key: PROTECTED_API_COMMIT
        value: "2c67a8f6b7495335357cf60a20f146bf4e10d669"
      - key: PROTECTED_FRONTEND_COMMIT
        value: "efe672ebaaa844f6663186b8a5d53a18ebab98a6"
      - key: PROTECTED_CUSTOMER_ORIGIN
        value: "https://conference-manager-demo.onrender.com"
      - key: PROTECTED_PLATFORM_ORIGIN
        value: "https://conference-manager-ops-demo.onrender.com"
      - key: PROTECTED_DATABASE_SSL
        value: "verify-full"
      - key: PROTECTED_SYNTHETIC_ENABLED
        value: "true"
      - key: PROTECTED_OWNER_CUSTOMER_ACCESS_ENABLED
        value: "true"
      - key: PROTECTED_HOSTED_FRONTEND_ENABLED
        value: "true"
      # Operator-owned values: creation prompts only; existing values preserved.
      - key: PROTECTED_SECURITY_EPOCH
        sync: false
      - key: PROTECTED_PLATFORM_SECURITY_EPOCH
        sync: false
      - key: PROTECTED_CUSTODY_ACTIVE_KEY_ID
        sync: false
      - key: PROTECTED_CUSTODY_KEYRING
        sync: false
      - key: PROTECTED_CUSTODY_LOOKUP_SECRET
        sync: false
      - key: PROTECTED_TENANT_AUDIT_HMAC_SECRET
        sync: false
      - key: PROTECTED_HANDOFF_SECRET
        sync: false
      - key: PROTECTED_OWNER_HANDOFF_SECRET
        sync: false
      - key: PROTECTED_PEER_ENTRA_CLIENT_ID
        sync: false
      - key: PROTECTED_SERVICE_VERSION
        value: "cm-int-20261021"
      - key: PROTECTED_HOSTED_FRONTEND_SHA256
        value: "244b03caa9fe5076d91741ccaf7ff44c51135446ecd7e3ea738f4e90bece8166"
      - key: PROTECTED_DATABASE_POOL_MAX
        sync: false
      - key: PROTECTED_LEASE_POOL_MAX
        sync: false
      - key: PROTECTED_SYNTHETIC_PARTICIPANTS_ENABLED
